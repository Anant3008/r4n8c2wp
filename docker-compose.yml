services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windsight-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./backend:/app
      - /app/__pycache__

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windsight-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
